<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VEYRO — Your Style</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .cart {
      font-size: 24px;
      cursor: pointer;
    }

    .hero {
      padding: 50px 20px;
      text-align: center;
      background: #f5f5f5;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      padding: 35px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .product {
      cursor: pointer;
    }

    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .product h2 {
      font-size: 18px;
      margin-top: 12px;
    }

    .price {
      margin-top: 6px;
      font-weight: bold;
    }

    /* ÜRÜN DETAYI */

    #productDetail {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
      z-index: 9999;
      overflow-y: auto;
      padding: 25px;
    }

    #productDetail.active {
      display: block;
    }

    .detail-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .close {
      font-size: 30px;
      cursor: pointer;
    }

    .detail-content {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .detail-image {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      background: #f5f5f5;
    }

    .detail-info {
      padding-top: 20px;
    }

    .detail-info h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .detail-price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .add-cart {
      width: 100%;
      padding: 16px;
      border: none;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .detail-content {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

    <div class="logo">VEYRO</div>
    <div class="cart">🛒</div>
  </header>

  <section class="hero">
    <h1>YOUR STYLE</h1>
    <p>VEYRO — Tarzını keşfet.</p>
  </section>

    </div>

      <h2>VEYRO Oversize — Beyaz</h2>

      <div class="price">499 TL</div>
    </div>
